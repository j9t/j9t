name: "dōteki"

on:
  schedule:
    # Schedule twice-weekly updates (offset avoids top-of-hour queue spikes)
    # https://crontab.guru/
    - cron: "17 4 * * 1,4"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Run dōteki action"
        uses: welpo/doteki-action@ee3e62c525039fc1cf303b8ae4563b0df4beea07
        env:
          GITHUB_TOKEN: ${{ secrets.DOTEKI }}